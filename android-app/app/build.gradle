plugins {
    id 'com.android.application'
}

// Signing details live in keystore.properties, which is NOT in git (see
// .gitignore) — the APK is personal, so there is no release-key
// continuity to preserve; if the file goes missing, regenerate it with
// the keytool command in android-app/README.md and rebuild.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.playthruu.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.playthruu.app"
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Falls back to an unsigned build if the keystore is absent
            // rather than failing with a confusing error.
            signingConfig keystorePropsFile.exists() ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The one dependency, and it is load-bearing: a WebView has no Push API
// at all, so the shell could never receive a notification for an app
// that was fully closed. A Trusted Web Activity runs the site in Chrome
// instead, which means Chrome's push machinery — and therefore Web Push
// — works. androidbrowserhelper supplies the launcher activity and the
// DelegationService that makes those notifications appear as Playthruu's
// own rather than as Chrome's.
dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
