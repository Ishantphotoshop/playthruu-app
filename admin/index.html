<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>PlayThruu Admin</title>
<meta name="description" content="Control room for PlayThruu — curate trending, publish news, moderate people.">
<meta name="theme-color" content="#0a0b0f">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Same three faces the main app loads, so the admin build reads as
     part of the same product rather than a different piece of software:
     Manrope for UI, Unbounded for the wordmark, IBM Plex Mono for the
     numbers and metadata this app is mostly made of. -->
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PlayThruu Admin">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="admin-root">
  <div class="boot">
    <div class="boot__mark"></div>
    <p class="boot__label">PlayThruu Admin</p>
  </div>
</div>
<script type="module" src="admin.js"></script>
</body>
</html>
