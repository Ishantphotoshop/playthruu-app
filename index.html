<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Playthruu — your gaming diary</title>
<meta name="description" content="Log, rate, and review the games you play. Follow friends and see what they're playing.">
<meta name="theme-color" content="#190b28">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Manrope: the app's general UI font (--font-display/--font-body),
     everywhere except the "PlayThruu" wordmark. No italic weights
     requested — Manrope doesn't ship a true italic on Google Fonts, so
     the two spots that set font-style:italic on --font-body (the entry
     and auth screen taglines) fall back to the browser's own
     synthesised oblique, which is fine for a geometric sans like this.
     Unbounded: the wordmark's font — a chunky, geometric display face
     with distinctive angled cuts on a few letterforms, picked to give
     the mark its own identity instead of reading as a slightly-bolder
     version of the body text. --font-brand is the only thing that
     references it, so swapping it again later only means changing this
     line + that one variable. -->
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Playthruu">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <div class="boot-loader">
    <div class="boot-loader__mark"></div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
<script>
  // A boot watchdog.
  //
  // The mark above is static markup in this file; app.js replaces it on
  // its first render. So if it is STILL here after a while, app.js never
  // ran — which on an ES-module page means one file in the graph failed
  // to load, and there is nothing on screen to say so. Waiting on a
  // spinner that will never finish is the worst version of that, and it
  // is exactly what a phone reported.
  //
  // 15 seconds, not 5: a cold start on a bad connection is genuinely
  // slow, and crying wolf over a slow load would be worse than the
  // spinner.
  (function () {
    var TIMEOUT = 15000;
    setTimeout(function () {
      var loader = document.querySelector('.boot-loader');
      if (!loader || !loader.isConnected) return; // the app started; nothing to do
      loader.innerHTML =
        '<div class="boot-fail">' +
        '<p class="boot-fail__title">Playthruu could not start</p>' +
        '<p class="boot-fail__body">Something did not download. This usually clears itself with a reset.</p>' +
        '<button type="button" class="boot-fail__btn" id="boot-reset">Reset and try again</button>' +
        '</div>';
      document.getElementById('boot-reset').addEventListener('click', function () {
        var done = function () { location.reload(); };
        // Clear the two things that can hold a broken copy: the service
        // worker and its caches. Either may be unavailable; reload
        // regardless rather than leaving the button dead.
        var jobs = [];
        try {
          if (navigator.serviceWorker) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            }));
          }
          if (window.caches && caches.keys) {
            jobs.push(caches.keys().then(function (ks) {
              return Promise.all(ks.map(function (k) { return caches.delete(k); }));
            }));
          }
        } catch (e) { /* fall through to the reload */ }
        Promise.all(jobs).then(done, done);
      });
    }, TIMEOUT);
  })();
</script>
<script>
  // The service worker caches the app shell, which is what you want in
  // production and actively harmful while developing: a saved edit would
  // not appear on reload, and even a hard refresh could be answered from
  // the worker's cache. So on localhost it is never registered, and any
  // worker left over from a previous visit is torn down along with its
  // caches. Everywhere else it registers exactly as before.
  if ('serviceWorker' in navigator) {
    // appassets.androidplatform.net is the native build (android-native/):
    // every file is already inside the APK and served locally, so a cache
    // layer in front of that adds nothing and a fetch handler in front of
    // the asset loader is just something else that can go wrong.
    var isLocalDev = ['localhost', '127.0.0.1', '::1', '', 'appassets.androidplatform.net']
      .indexOf(location.hostname) !== -1
      || location.protocol === 'file:';

    if (isLocalDev) {
      navigator.serviceWorker.getRegistrations()
        .then(function (regs) { regs.forEach(function (r) { r.unregister(); }); })
        .catch(function () {});
      if (window.caches && caches.keys) {
        caches.keys()
          .then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); })
          .catch(function () {});
      }
    } else {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('service-worker.js').then(function (reg) {
          // Re-check for a new service-worker.js whenever the app is
          // reopened or brought back to the foreground. This bypasses the
          // browser's normal HTTP cache for the worker script itself (the
          // spec requires that), so it's the one request that isn't stuck
          // behind GitHub Pages' 10-minute Cache-Control — otherwise a
          // phone could sit on a stale build for hours between visits.
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') reg.update().catch(function () {});
          });
        }).catch(function () {
          // Offline caching just won't be available — the app still works online.
        });

        // The worker calls skipWaiting() + clients.claim() on its own
        // (see service-worker.js), so a new version takes over the page
        // as soon as it's ready — no "click to update" prompt needed.
        // controllerchange only fires when an update REPLACES an already-
        // active worker, never on a page's first-ever install, so this
        // can't loop or fire on a fresh visit.
        // The guard used to be a plain variable, which is reset by the
        // very reload it is guarding: if controllerchange ever fired
        // again on the fresh page, nothing stopped it reloading again,
        // and a wedged worker could hold the app in a reload loop that
        // looks exactly like "it won't open". sessionStorage survives
        // the reload, so the app can now only ever refresh itself ONCE
        // per tab, whatever the worker does.
        var RELOAD_KEY = 'playthruu:sw-refreshed';
        var alreadyRefreshed = false;
        try { alreadyRefreshed = sessionStorage.getItem(RELOAD_KEY) === '1'; } catch (e) {}
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (alreadyRefreshed) return;
          alreadyRefreshed = true;
          try { sessionStorage.setItem(RELOAD_KEY, '1'); } catch (e) {}
          window.location.reload();
        });
      });
    }
  }
</script>
</body>
</html>
