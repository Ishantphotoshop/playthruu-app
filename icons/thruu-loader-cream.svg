<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="512" height="512">
<style>
  .thruu-loader__chase {
    stroke-dashoffset: 26;
    animation: thruu-loader-chase 1.5s cubic-bezier(.4,0,.3,1) infinite both;
  }
  @keyframes thruu-loader-chase {
    0%   { stroke-dashoffset: 26; }
    50%  { stroke-dashoffset: -100; }
    100% { stroke-dashoffset: 26; }
  }
  @media (prefers-reduced-motion: reduce) {
    .thruu-loader__chase { animation: none; stroke-dasharray: none; stroke-dashoffset: 0; }
  }
</style>
